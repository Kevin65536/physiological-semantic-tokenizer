 <div><div class="kicker">从实测波形到逆问题 · 交互讲解</div><h1>拟合得像，解释得对吗？</h1><div class="muted small">看见预测如何靠近观测，也看见误差可能去了哪里。</div></div>
 <div class="header-note">2 个实测窗口 · 8 步连贯演示<br>支持暂停、拖动进度与参数对照<br>离线文件 · 证据日期 2026-09-28 / 导出 2026-10-09</div>

  </div>

<script>
'use strict';
const D=JSON.parse(document.getElementById('evidence').textContent);
const C={ink:'#152a39',muted:'#657681',blue:'#2864ce',teal:'#138079',orange:'#d66532',purple:'#8655ba',grey:'#a3b3bc',grid:'#e4ebef'};
const $=id=>document.getElementById(id), clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const fmt=(x,n=3)=>Number.isFinite(x)?x.toFixed(n):'—';
const rms=x=>Math.sqrt(x.reduce((s,v)=>s+v*v,0)/x.length);
const column=(a,c)=>a.map(v=>v[c]);
const errors=(y,p)=>[0,1,2].map(j=>rms(y.map((v,i)=>v[j]-p[i][j])));
const sub=(a,b)=>a.map((r,i)=>r.map((v,j)=>v-b[i][j]));
const scale=(a,c)=>a.map(v=>v*c);
const lerp=(a,b,x)=>a+(b-a)*x;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const measuredLegend='<div class="legend"><span><i class="swatch dot-swatch"></i>实测目标（固定）</span><span><i class="swatch" style="border-color:var(--blue)"></i>模型预测</span></div>';
const chapters=[
 {nav:'先看输入',title:'01　先固定数据：拟合改变的是模型，不是观测点',badge:'保留实测',type:'',duration:23,lead:'每个点表示一个窗口内、一个时刻、一个观测分量的数值。连线只帮助读出时间顺序；120 个时刻不是 120 位被试。'},
 {nav:'好与难的两例',title:'02　同一方法：一例贴合，一例仍有明显偏离',badge:'历史非线性拟合',type:'',duration:29,lead:'两例使用同一方法和无运动校正分支。参数与尺度来自各自 18 个训练窗口；当前窗口的 120 点驱动和 5 个初态重新拟合，三路观测全部可见。'},
 {nav:'跟随拟合过程',title:'03　一条驱动改变，三路预测一起移动',badge:'实测输入 × 线性教学演算',type:'calc',duration:36,lead:'从零驱动、静息初态开始。用已有线性前向链条做连续最小二乘梯度流，预测、驱动和损失同步更新；终点与保留的线性筛查逐点核对。'},
 {nav:'误差留在哪里',title:'04　观察剩下的误差，不能追溯全部误差去向',badge:'历史非线性结果',type:'',duration:29,lead:'这里回到保留的非线性拟合终点。橙色残差 = 实测 − 预测。每个散点对应同一时刻的两路 Hb 残差，时间相邻的点存在依赖。'},
 {nav:'增加一个方向',title:'05　多一种波形方向，残差更小，来源仍未确定',badge:'实测输入 × 条件线性演算',type:'calc',duration:34,lead:'在同一线性模型上增加六个慢余弦系数。逐渐放松新增系数的惩罚，每一步重新求最优驱动和初态；比较等维的“共同变化”与“氧交换方向”。'},
 {nav:'好拟合仍会混淆',title:'06　曲线不变，驱动与增益却可以改变',badge:'代数反事实 · 不是新实测',type:'calc',duration:34,lead:'以较好样例的条件拟合解为参考，演示一个精确的增益交换。参考解并不是已知生理真值；这个操作揭示混淆通道，不判定该被试实际被污染了多少。'},
 {nav:'为什么不稳定',title:'07　参数的独有方向越短，同一偏离推动得越远',badge:'二维示意 · 不来自实测雅可比',type:'toy',duration:36,lead:'把整段观测空间压缩成一个可算的二维例子：蓝箭头代表参数 θ 的作用，灰箭头代表驱动/初态 η 的作用。两个方向越相似，越容易互相补偿。'},
 {nav:'哪些结论成立',title:'08　把重建能力与生理可信度分开判断',badge:'证据与解释',type:'',duration:24,lead:'困难样例揭示表达能力的限制；较好样例展示了低重建误差。后者仍需要独立约束来排除错误吸收。'}
];
const S={chapter:0,progress:0,playing:false,caseKey:'difficult',timeIndex:0,extra:'volume',gain:1,gainMode:'gauge',angle:12,delta:.12,prior:0,bound:true,last:0};
const selected=()=>D.cases.find(c=>c.key===S.caseKey), frame=(n,p=S.progress)=>Math.min(n-1,Math.floor(clamp(p/.80)*(n-1)));
function metric(label,id,value='—',subtext=''){return `<div class="metric"><div class="label">${label}</div><div class="value" id="${id}">${value}</div><div class="sub">${subtext}</div></div>`}
function plots(prefix,classes=''){return ['EEG 特征','HbO','HbR'].map((name,j)=>`<canvas id="${prefix}${j}" class="plot ${classes}" role="img" aria-label="${name} 随事件时间的曲线"></canvas>`).join('')}
function nrmseMetrics(prefix){return `<div class="metric-row">${['EEG','HbO','HbR'].map((v,j)=>metric(v+' NRMSE',prefix+j)).join('')}</div>`}
function card(title,inner,extra=''){return `<div class="card ${extra}"><h3>${title}</h3>${inner}</div>`}
function endNotice(id='narration'){return `<div class="notice" id="${id}"></div>`}
function setCase(key){S.caseKey=key;S.playing=false;S.progress=0;S.timeIndex=0;mount()}
function setChapter(i){S.chapter=clamp(i,0,chapters.length-1);S.progress=0;S.timeIndex=0;if(i===5)S.caseKey='good';S.gain=1;mount();window.scrollTo(0,0)}
function setPlaying(value){S.playing=value;S.last=0;if(value&&S.progress>=1)S.progress=0;draw();}
function identity(c){return `${c.identity.subject.replace('subject_','S')} · ${c.identity.session} · event ${c.identity.event_index} · fold 3 / trial ${c.trial}`}
function mount(){
 const ch=chapters[S.chapter],c=selected(),goodCase=D.cases.find(v=>v.key==='good');
 $('title').textContent=ch.title;$('lead').textContent=ch.lead;$('badge').textContent=ch.badge;$('badge').className='badge '+ch.type;
 $('chapters').innerHTML=chapters.map((v,i)=>`<button class="${i===S.chapter?'active':''}" data-chapter="${i}" ${i===S.chapter?'aria-current="step"':''}><span class="num">${i+1}</span><span>${v.nav}</span></button>`).join('')+'<div class="nav-note">默认按顺序连播，约 4 分钟。<br>任何一节都可暂停与回看。<br><br>实测、教学计算和示意推导始终分别标注。</div>';
 document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{S.playing=false;setChapter(+b.dataset.chapter)});
 $('caseSwitch').innerHTML=[0,2,3,4,5].includes(S.chapter)?D.cases.map(v=>`<button data-case="${v.key}" class="${S.caseKey===v.key?'active':''}" aria-pressed="${S.caseKey===v.key}">${v.label} · ${v.identity.subject.replace('subject_','S')}</button>`).join(''):'';
 document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>setCase(b.dataset.case));

function canvas(id){const el=$(id);if(!el)return null;const rect=el.getBoundingClientRect(),w=Math.max(rect.width,150),h=Math.max(rect.height,100),dpr=window.devicePixelRatio||1;if(el.width!==Math.round(w*dpr)||el.height!==Math.round(h*dpr)){el.width=Math.round(w*dpr);el.height=Math.round(h*dpr)}const g=el.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);g.font='12px system-ui,"Microsoft YaHei",sans-serif';g.lineJoin='round';g.lineCap='round';return{g,w,h,el}}
function axes(id,o={}){
 const z=canvas(id);if(!z)return null;
 const{g,w,h}=z,m={l:54,r:18,t:31,b:37};
 g.font='600 12px system-ui,"Microsoft YaHei",sans-serif';
 const titleLines=[];let titleLine='';
 for(const char of (o.title||'')){
  if(titleLine&&g.measureText(titleLine+char).width>w-m.l-m.r){titleLines.push(titleLine);titleLine=''}
  titleLine+=char;
 }
 titleLines.push(titleLine);m.t=17+14*titleLines.length;
 let[ymin,ymax]=o.ylim||[-1,1];if(ymax<=ymin)ymax=ymin+1;
 let[xmin,xmax]=o.xlim||[-5,24.75];
 if(o.equal){
  const unit=Math.min((w-m.l-m.r)/(xmax-xmin),(h-m.t-m.b)/(ymax-ymin));
  const cx=(xmin+xmax)/2,cy=(ymin+ymax)/2,dx=(w-m.l-m.r)/unit/2,dy=(h-m.t-m.b)/unit/2;
  xmin=cx-dx;xmax=cx+dx;ymin=cy-dy;ymax=cy+dy;
 }
 const X=x=>m.l+(x-xmin)/(xmax-xmin)*(w-m.l-m.r);
 const Y=y=>h-m.b-(y-ymin)/(ymax-ymin)*(h-m.t-m.b);
 g.fillStyle=C.ink;titleLines.forEach((v,i)=>g.fillText(v,m.l,16+14*i));
 g.font='11px system-ui,"Microsoft YaHei",sans-serif';
 for(let j=0;j<5;j++){
  const v=ymin+(ymax-ymin)*j/4;g.strokeStyle=C.grid;g.lineWidth=1;
  g.beginPath();g.moveTo(m.l,Y(v));g.lineTo(w-m.r,Y(v));g.stroke();
  g.textAlign='right';g.fillStyle=C.muted;
  g.fillText(o.ytick?o.ytick(v):fmt(v,Math.abs(ymax-ymin)<.1?3:1),m.l-8,Y(v)+4);
 }
 g.textAlign='center';
 for(const t of o.xticks||[-5,0,5,10,15,20]){
  if(t<xmin||t>xmax)continue;g.fillStyle=C.muted;
  g.fillText(o.xtick?o.xtick(t):t,X(t),h-m.b+17);
 }
 g.textAlign='right';g.fillText(o.xlabel===undefined?'事件相对时间 / 秒':o.xlabel,w-m.r,h-3);g.textAlign='left';
 if(ymin<0&&ymax>0){g.strokeStyle='#bac8d0';g.setLineDash([3,3]);g.beginPath();g.moveTo(m.l,Y(0));g.lineTo(w-m.r,Y(0));g.stroke();g.setLineDash([])}
 if(o.event!==false&&xmin<0&&xmax>0){g.strokeStyle='#a1b3bb';g.setLineDash([3,4]);g.beginPath();g.moveTo(X(0),m.t);g.lineTo(X(0),h-m.b);g.stroke();g.setLineDash([])}
 return{...z,X,Y,m,ymin,ymax,xmin,xmax};
}
function line(a,x,y,color,width=2,dash=[]){const{g,X,Y,w,h,m}=a;g.save();g.beginPath();g.rect(m.l,m.t,w-m.l-m.r,h-m.t-m.b);g.clip();g.strokeStyle=color;g.lineWidth=width;g.setLineDash(dash);g.beginPath();y.forEach((v,i)=>i?g.lineTo(X(x[i]),Y(v)):g.moveTo(X(x[i]),Y(v)));g.stroke();g.restore()}
function point(a,x,y,color,r=4,shape='circle'){const{g,X,Y}=a;g.strokeStyle=color;g.fillStyle=color;g.lineWidth=2;if(shape==='cross'){g.beginPath();g.moveTo(X(x)-r,Y(y)-r);g.lineTo(X(x)+r,Y(y)+r);g.moveTo(X(x)+r,Y(y)-r);g.lineTo(X(x)-r,Y(y)+r);g.stroke()}else{g.beginPath();g.arc(X(x),Y(y),r,0,2*Math.PI);g.fill()}}
function series(id,items,o={}){const all=items.flatMap(v=>v.y);let lo=Math.min(0,...all),hi=Math.max(0,...all);const span=hi-lo||1;const a=axes(id,{...o,ylim:o.ylim||[lo-span*.12,hi+span*.12]});if(!a)return;for(const v of items){const x=v.x||D.time_s;if(v.points){for(let k=0;k<v.y.length;k+=2)point(a,x[k],v.y[k],v.color||C.ink,1.65);line(a,x,v.y,v.color||C.ink,.7)}else line(a,x,v.y,v.color||C.blue,v.width||2,v.dash||[])}if(o.cursor!==false){const i=S.timeIndex,t=D.time_s[i];a.g.strokeStyle='#7e9199';a.g.lineWidth=1;a.g.beginPath();a.g.moveTo(a.X(t),a.m.t);a.g.lineTo(a.X(t),a.h-a.m.b);a.g.stroke();items.slice(0,2).forEach(v=>{if(v.y.length===120)point(a,t,v.y[i],v.color||C.blue,4)})}return a}
function wave(prefix,y,p,other=[],limits=null){['EEG 特征','HbO','HbR'].forEach((name,j)=>series(prefix+j,[{y:column(y,j),color:C.ink,points:true},...(p?[{y:column(p,j),color:C.blue}]:[]),...other.map(v=>({...v,y:column(v.y,j)}))],{title:name+' / 训练 SD',ylim:limits?.[j]}))}
function metricSet(prefix,values){values.forEach((v,j)=>{const el=$(prefix+j);if(el)el.textContent=fmt(v)})}
function caseLimits(c,extra=false){return[0,1,2].map(j=>{let values=[...column(c.target,j),...column(c.prediction,j),...c.linear.prediction.flatMap(a=>column(a,j))];if(extra)for(const e of Object.values(c.extras))values.push(...e.prediction.flatMap(a=>column(a,j)),...e.physical.flatMap(a=>column(a,j)),...e.additional.flatMap(a=>column(a,j)));const lo=Math.min(0,...values),hi=Math.max(0,...values),d=(hi-lo)*.1;return[lo-d,hi+d]})}

function populateMethods(){const sel=D.selection;$('methodsBody').innerHTML=`<div class="sources-grid"><div><h3>输入和选择</h3><p>数据集：TU Berlin EEG+NIRS Single-Trial，心算窗口；固定 Hb 通道对 AF7Fp1，无运动校正分支。EEG 是训练冻结的多通道对数功率主成分；Hb 是条件光学映射中的相对坐标，不是独立标定的绝对 µM。</p><p>两个窗口都来自 no_motion / outer=3。较好例选择范围：${sel.planned_windows} 个窗口，${sel.successful_windows} 个成功，${sel.independent_subjects} 位被试。主成分、尺度和 β 由各自 18 个训练窗口决定；这些窗口的六条验证轨迹都做全观测重建。</p><p>观测维度 360；当前窗口拟合自由度 125。β、κ、τ 冻结。参数选择发生在训练阶段，不能把此动画称为逐验证窗口联合估计 β、κ、τ。</p><p>难例和好例的分量尺度分别为：<br>${D.cases.map(c=>`${c.label}：${c.sd.map(v=>fmt(v,6)).join(' / ')}`).join('<br>')}。</p><p>滤波、基线与 PCA 带来时间依赖；360 个数值不能当作 360 次独立重复。没有绘制统计置信区间。</p></div><div><h3>新演算与已有证据的区别</h3><p>第 3 节使用既有线性设计矩阵的 SVD 解析梯度流：z(u)=V diag[(1−exp(−σ²u))/σ] Uᵀb。截断阈值与历史一致，为最大奇异值的 10⁻¹⁰。终点逐点复现原线性筛查。</p><p>第 5 节对新增系数做岭惩罚路径；驱动与初态每帧解析消元。λ=0 的两种终点都与各自保留数组核对，不将中间路径冒称历史优化日志。</p><p>第 6 节的增益变换在两例上用非线性 RK4 前向重放核对（c=0.5、1.25、2）。第 7 节的夹角、偏离和边界均是显式构造的无量纲示意参数。</p><p>共 ${D.checks.length} 项证据/代数重放检查通过。网页中的 SSE 不包含历史非线性运行的工程惩罚，二者不能混比。</p><p>模型流形的几何解释可参见 <a href="https://arxiv.org/abs/1010.1449" target="_blank" rel="noreferrer">Transtrum 等：非线性最小二乘的几何</a>。本文献说明机制，不替代此项目的实测证据。</p></div></div><h3>本地证据与实现</h3><p>原数据说明：<span class="source-path">data/EEG+NIRS Single-Trial/Open access dataset for simultaneous EEG and NIRS Brain-Computer Interfaces (BCIs).html</span>。实现：<span class="source-path">src/inference/shared_driver_reconstruction.py</span> 与 <span class="source-path">src/inference/observation_baselines.py</span>。导出入口：<span class="source-path">experiments/scripts/render_shared_driver_reconstruction.py --fitting-explainer</span>。</p><div class="source-list">${D.sources.map(v=>`<div class="source-path">${esc(v)}</div>`).join('')}</div><p>完整数值复核在本 HTML 同目录的 <a href="verification.json">verification.json</a>。页面内所有曲线数据已内嵌；不联网、不读取原始数据、不上传信号。原运行、失败证据和旧报告保持其原始身份。</p>`}
$('play').onclick=()=>setPlaying(!S.playing);$('prev').onclick=()=>{S.playing=false;setChapter(S.chapter-1)};$('next').onclick=()=>{S.playing=false;setChapter(S.chapter+1)};
$('reset').onclick=()=>{Object.assign(S,{chapter:0,progress:0,playing:false,caseKey:'difficult',timeIndex:0,extra:'volume',gain:1,gainMode:'gauge',angle:12,delta:.12,prior:0,bound:true,last:0});$('speed').value='1';$('autonext').checked=true;mount()};
$('timeline').oninput=e=>{S.playing=false;S.progress=+e.target.value/1000;if([0,1,3].includes(S.chapter))S.timeIndex=Math.round(clamp(S.progress/.8)*119);if(S.chapter===5)S.gain=1+clamp(S.progress/.8);draw()};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();setPlaying(!S.playing)}if(e.key==='ArrowRight'){S.playing=false;setChapter(S.chapter+1)}if(e.key==='ArrowLeft'){S.playing=false;setChapter(S.chapter-1)}});
let resizeFrame;window.addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(draw)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){S.playing=false;S.last=0;draw()}});
function tick(now){if(S.playing){if(S.last){S.progress=Math.min(1,S.progress+(now-S.last)/1000/chapters[S.chapter].duration*Number($('speed').value));if(S.progress>=1){if($('autonext').checked&&S.chapter<7)setChapter(S.chapter+1);else S.playing=false}}S.last=now;draw()}else S.last=0;requestAnimationFrame(tick)}
window.addEventListener('error',e=>{$('error').style.display='block';$('error').textContent='演示遇到错误：'+e.message;S.playing=false});
$('view').before(document.querySelector('.player'));
populateMethods();mount();requestAnimationFrame(tick);
window.explainer={state:S,data:D,setChapter,setCase,draw,setPlaying,errors};
</script>
