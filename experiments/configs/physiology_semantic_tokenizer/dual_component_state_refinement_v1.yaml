schema: dual_component_state_refinement_v1
experiment_id: TK-STATE-RECON-v1
base_contract: experiments/configs/physiology_semantic_tokenizer/dual_component_state_v1.yaml
parent_run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261112_state_pilot_v1
data:
  allowed_splits: [train]
  scope: exact_parent_four_training_subjects_five_windows
  test_access: forbidden
  protected_data: forbidden
  teacher_refits: false
  cache_reuse: unchanged_200Hz_EEG_10Hz_Hb_arrays_scales_and_masks
  evaluation: same_within_subject_holdout_now_explicit_development_after_previous_inspection
architectures:
  dense_long:
    width: 64
    latent_dim: 32
    waveform_io: false
    sum_weight: 0.0
    derivative_weight: 0.0
  waveform:
    width: 128
    latent_dim: 64
    waveform_io: true
    local_width: 32
    sum_weight: 0.5
    derivative_weight: 0.1
training:
  seeds: [17]
  candidates: [continuous, vq128, vq512]
  modalities: [eeg, hb]
  warmup_steps: 1000
  continuation_steps: 3000
  checkpoint_every: 500
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 5.0
  initialization_per_dataset: 64
  ema_decay: 0.99
  dead_code_threshold: 0.1
  revival_stop_after_steps: 1500
  max_revivals_per_event: 8
  target_difference_variance_floor_fraction: 0.0001
  stopping: four_1000_step_warmups_then_twelve_3000_step_continuations_all_terminal_no_result_dependent_extension
evaluation:
  primary: paired_dataset_equal_X_S_O_NMSE_on_original_complete_holdout_panel
  secondary: per_color_correlation_amplitude_signed_boundary_error_and_delta_error
  diagnostic: train_holdout_gap_code_occupancy_effective_codes_revival_and_frozen_integer_replay
  baseline: retained_500step_pilot_and_equal_exposure_dense_long_same_K
  null: no_improvement_in_either_modality_or_component_degradation_or_health_collapse
  engineering_goal: at_least_20percent_lower_macro_X_NMSE_in_both_modalities_and_no_more_than_5percent_worse_macro_S_or_O
  selection: report_all_terminal_models_rank_by_mean_relative_S_O_X_error_within_modality_no_checkpoint_selection
  examples: exact_27_parent_reconstruction_examples_no_reselection_by_new_error
  code_rate: one_ID_per_branch_per_2s_K128_7bits_per_s_K512_9bits_per_s
  health: report_full_training_crop_and_holdout_counts_by_dataset_branch_no_threshold_changed_after_results
  health_screen:
    pooled_minimum_active_fraction: 0.8
    pooled_minimum_effective_fraction: 0.5
    pooled_maximum_top1: 0.15
    dataset_minimum_effective_fraction: 0.1
    dataset_maximum_top1: 0.35
  training_monitor: fixed_128_training_examples_every_500_steps_with_EMA_frozen
resources:
  devices: [cuda:0, cuda:1]
  workers_per_device_candidates: [1, 2]
  benchmark_steps: 100
  torch_threads: 2
  numerical_threads: 1
  max_worker_gpu_memory_GiB: 4
  supervisor: user_systemd_linger
claim_limits:
  - engineering_development_on_previously_viewed_training_subject_holdout
  - waveforms_plus_width_plus_objective_form_one_package_not_single_factor_attribution
  - no_continuous_sidecars_or_raw_X_skip_into_hard_decoder
  - preserve_S_O_targets_masks_and_all_outlier_positions
  - no_new_independent_subject_or_physiology_acceptance
