  learning_rate_schedule_steps: 2048
resources:
  supervisor: user_systemd_linger
  device: cpu
  torch_threads: 4
  benchmark_threads:
  - 4
  benchmark_steps: 10
  numerical_threads: 4
  mmap_parent_cache: 128
  memory_gib: 16
  wall_budget_seconds: 360
