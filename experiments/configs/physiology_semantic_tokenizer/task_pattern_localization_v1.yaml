experiment_id: TK-TASK-PATTERN-LOCALIZATION-v1
scope: Exploratory post-screen characterization of two candidates on retained scored MA and WG trials, with MI as a descriptive specificity panel. No test, protected, or new signal reads.
beta: Compare per-site 17..25 versus 1..9 s beta power change, left minus right balance, bilateral mean, prestimulus asymmetry and corresponding alpha difference. Repeat signed balance AUC conditional on preceding native event label within record, consecutive ordinal and EEG/Hb onset separation <=40s. Also require >=5 trials/class per person for a support sensitivity.
Hb: Compare Hb-S frontal Q4 late-minus-early occupancy with same statistic for observed upper-quartile two-second HbO slopes (linear least squares; threshold per frontal site from training trials only). Compare identical continuous Hb phase readouts with either one additional scalar; train-person CV, original development events.
stopping: Describe the components, counterexamples and limits. No candidate re-ranking or new training. All comparisons on previously examined splits.
