primary: capacity-control minus paired future Hb-change NMSE; equal weights for sites, colors and horizons, then seeds within subject and subjects. Training population SD per target.
secondary: n-back three-condition Brier score for H, E and HE using the same training and development subjects. Labels only enter the readout.
diagnostic: strict unfiltered Hb history with versus without first-five-second subtraction; no other input change
null: no EEG gain above Hb expansion or same-condition donor. Real and mismatched EEG are fitted and evaluated separately.
E0: [raw_bands, input_bands, pre_vq, embedding, decoded_bands, family64]
readers: full unreferenced history grouped-OOF ridge anchor. Fixed linear residual on equal-width inputs (Hb squared expansion); P1 zero-initialized conditional slot residual with Hb source as capacity control. Features standardized on training events, padded to 128 with no trainable adapter.
E1:
  family_sizes: [64, 32]
  family: train ID mean observed alpha log power, train-token frequency quantiles per branch, unknown reserved. Frozen train distributions.
  controls: permute family assignments within exact training ID count; sequence Euler trail preserves each window/site/branch's directed bigram counts and endpoints
  features: site and branch specific unigram bags versus bags plus ordered bigram and trigram counts; exact sparse count kernels, same residual regularization
E4: replay dev two-second replacements at 15 slots; verify retained per-person off-slot change proportions; record full input/output influence by ID, family and decoded log alpha. These are model sensitivities.
E7:
  candidates: [A, B, C]
  parent: single_vq_spectral_location/20261125_v1/seed_17
  selection: ordered training subjects, final third for selection and remaining for fitting. Both policies score identical public selection events.
  R: lowest observed-X recon NMSE; break ties by active-code coverage then measured alpha readout
  M: require reconstruction within 5 percent of best; rank by paired future-Hb improvement, break ties by measured alpha readout
  evaluation: fix both choices before scoring ordinary development subjects. Historical project development exposure disclosed. No independent confirmation or speed claim.
stopping: one development screen. No tokenizer retraining or combinations are triggered automatically. Four development subjects provide exploratory support only.
