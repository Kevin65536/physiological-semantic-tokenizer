schema: dual_component_base_matrix_v1
experiment_id: TK-BASE-INPUT-QUANTIZATION-B-v1
data:
  run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261117_base_g0_v2
  contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_g0_v1.yaml
  allowed_splits:
  - train
  - validation
  test_access: forbidden
  protected_data: forbidden
  teacher_refits: false
  raw_reads: false
  coordinates: exact_completed_G0_arrays_masks_scales_and_population
model:
  codebook_size: 128
  patches: 15
  heads: 4
  encoder_layers: 2
  decoder_layers: 2
  dropout: 0.0
  kmeans_iters: 20
  ema_decay: 0.99
  commitment_cost: 0.25
  dead_code_threshold: 0.1
  revival_warmup_steps: 100
  revival_interval: 50
  revival_stop_after_steps: 1500
  max_revivals_per_event: 8
architectures:
  waveform8:
    width: 128
    latent_dim: 64
    waveform_io: true
    local_width: 32
    sum_weight: 0.5
    derivative_weight: 0.1
    internal_steps: 8
    sample_strides: &id001
    - 5
    - 2
    - 5
    kernel_strides: &id002
    - 5
    - 4
    - 5
  target8:
    width: 128
    latent_dim: 64
    waveform_io: true
    local_width: 32
    sum_weight: 0.5
    derivative_weight: 0.1
    internal_steps: 8
    sample_strides: *id001
    kernel_strides: *id002
    target_input: true
  target_input:
    width: 128
    latent_dim: 64
    waveform_io: true
    local_width: 32
    sum_weight: 0.5
    derivative_weight: 0.1
    target_input: true
tasks:
- modality: eeg
  architecture: waveform8
  candidate: vq128
- modality: eeg
  architecture: target8
  candidate: continuous
- modality: eeg
  architecture: target8
  candidate: vq128
- modality: hb
  architecture: target_input
  candidate: vq128
training:
  seed: 17
  warmup_steps: 1000
  total_steps: 10000
  batch_size: 64
  learning_rate: 0.0003
  final_learning_rate: 3.0e-05
  decay_start_step: 4000
  learning_rate_schedule: constant_then_cosine_on_absolute_10000_step_clock
  weight_decay: 0.0001
  gradient_clip: 5.0
  checkpoint_every: 500
  monitor_examples: 512
  monitoring: fixed_training_draws_seed_8017_not_validation_selection
  warmup_sharing: one_per_modality_architecture_same_weights_and_exposure_for_both_candidates
  optimizer_at_branch: reset_for_both_continuous_and_quantized_continuations
  initialization: exact_G0_one_crop_position_per_training_record_encode_in_batches_then_initialize_once
  stopping: matched final 10000 updates; one fresh EEG target warmup shared by both
    continuations
evaluation:
  steps:
  - 4000
  - 7000
  - 10000
  batch_size: 64
  roles:
  - train
  - validation
  - regression
  support: all_G0_nonoverlapping_score_inputs_and_original_five_regression_blocks
  primary: X_S_O_and_color_equal_then_position_window_record_subject_dataset_equal_NMSE
  secondary: NRMSE_RMSE_bias_correlation_RMS_gain_level_shape_and_EEG_band_power
  health: actual_ID_counts_train_validation_per_subject_dataset_branch
  patterns: training_fitted_single_ID_centered_target_and_X_prototypes_validation_readout
  checkpoint_selection: complete validation only; compare at matched final step
  replay_atol: 2.0e-06
  replay_rtol: 1.0e-05
  baseline: paired E1 and G1 X-input and D1 target-input controls
  null_hypothesis: no matched input or quantization difference within modality
  failed_models: retain all four outcomes
  fixed_examples: first_validation_parent_per_dataset_first_middle_last_available_position_plus_all_regression_inputs
  budget_rule: fixed final 10000
  budget_macro_relative_tolerance: 0.02
  budget_component_relative_tolerance: 0.05
  budget_fallback: 10000_and_mixed_or_unsettled_no_automatic_additional_steps
  integer_replay_check: disabled_by_user
resources:
  devices:
  - cuda:0
  - cuda:1
  visible_gpu_uuids:
  - GPU-130bb706-1e2e-4523-d23e-6d98c8d9854c
  - GPU-55cf9000-4186-30c0-c608-8717ba93f3ca
  workers_per_device_candidates:
  - 1
  - 2
  benchmark_steps: 40
  benchmark_evaluation_examples: 256
  benchmark_tasks:
  - eeg_waveform8
  - hb_target_input
  - eeg_target8
  - eeg_waveform8
  torch_threads: 2
  numerical_threads: 1
  mmap_parent_cache: 256
  gpu_memory_limit_gib: 4
  supervisor_memory_gib: 96
  supervisor: user_systemd_linger
external_warmups:
  eeg__waveform8:
    run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261119_e1_waveform8_v1
    contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_e1_v1.yaml
    task_id: eeg__waveform8__warmup
  hb__target_input:
    run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261118_d0_d1_h1_v1
    contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_diagnostics_v1.yaml
    task_id: hb__target_input__warmup
matrix:
  new_cells:
  - EEG_X_K128
  - EEG_target_continuous
  - EEG_target_K128
  - Hb_target_K128
  controls:
    EEG_X_continuous:
      run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261119_e1_waveform8_v1
      contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_e1_v1.yaml
      task: eeg__waveform8__continuous
    Hb_X_continuous:
      run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261117_base_g1_v2
      contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_g1_v1.yaml
      task: hb__waveform__continuous
    Hb_X_K128:
      run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261117_base_g1_v2
      contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_g1_v1.yaml
      task: hb__waveform__vq128
    Hb_target_continuous:
      run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261118_d0_d1_h1_v1
      contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_diagnostics_v1.yaml
      task: hb__target_input__continuous
