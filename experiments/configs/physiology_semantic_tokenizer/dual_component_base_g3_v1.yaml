schema: dual_component_base_g3_v1
experiment_id: TK-BASE-v1-G3
data:
  run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261117_base_g0_v2
  contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_g0_v1.yaml
  allowed_splits:
  - train
  - validation
  test_access: forbidden
  protected_data: forbidden
  teacher_refits: false
  raw_reads: false
  coordinates: exact_completed_G0_arrays_masks_scales_and_population
model:
  codebook_size: 128
  patches: 15
  heads: 4
  encoder_layers: 2
  decoder_layers: 2
  dropout: 0.0
  kmeans_iters: 20
  ema_decay: 0.99
  commitment_cost: 0.25
  dead_code_threshold: 0.1
  revival_warmup_steps: 100
  revival_interval: 50
  revival_stop_after_steps: 1500
  max_revivals_per_event: 8
architectures:
  waveform:
    width: 128
    latent_dim: 64
    waveform_io: true
    local_width: 32
    sum_weight: 0.5
    derivative_weight: 0.1
tasks:
- modality: eeg
  architecture: waveform
  candidate: vq128
training:
  seed: 17
  warmup_steps: 1000
  total_steps: 10000
  batch_size: 64
  learning_rate: 0.0003
  final_learning_rate: 3.0e-05
  decay_start_step: 4000
  learning_rate_schedule: constant_then_cosine_on_absolute_10000_step_clock
  weight_decay: 0.0001
  gradient_clip: 5.0
  checkpoint_every: 500
  monitor_examples: 512
  monitoring: fixed_training_draws_seed_8017_not_validation_selection
  warmup_sharing: reuse_exact_G1_EEG_waveform64_1000step_checkpoint
  optimizer_at_branch: reset_as_in_G1_hard_baseline
  initialization: exact_G0_one_crop_position_per_training_record_encode_in_batches_then_initialize_once
  stopping: one_seed17_candidate_9000_new_updates_after_reused1000_no_automatic_next_stage
  quantization_transition_steps: 1000
  transition_monitor_every: 250
  quantization_blend: alpha=(quantized_stage_step-1)/999 clipped to [0,1]; first quantized
    update 0, update1000 and later 1
  quantizer_controls: EMA_and_commitment_strength_unchanged_at_all_steps
evaluation:
  steps:
  - 4000
  - 7000
  - 10000
  batch_size: 64
  roles:
  - train
  - validation
  - regression
  support: all_G0_nonoverlapping_score_inputs_and_original_five_regression_blocks
  primary: X_S_O_and_color_equal_then_position_window_record_subject_dataset_equal_NMSE
  secondary: NRMSE_RMSE_bias_correlation_RMS_gain_level_shape_and_EEG_band_power
  health: actual_ID_counts_train_validation_per_subject_dataset_branch
  patterns: training_fitted_single_ID_centered_target_and_X_prototypes_validation_readout
  checkpoint_selection: lowest_complete_validation_macro_NMSE_earliest_step_on_exact_tie
  baseline: exact_G1_EEG_waveform64_K128_direct_hard_switch_same_warmup_and_sampler
  null_hypothesis: no_joint_training_and_validation_gain_or_persistent_quantization_loss
  failed_models: one_planned_candidate_retained_without_replacement
  fixed_examples: first_validation_parent_per_dataset_first_middle_last_available_position_plus_all_regression_inputs
  budget_rule: reuse_audited_G1_10000_step_budget
  integer_replay_check: disabled_by_user
  screen:
    reconstruction_improvement_min: 0.1
    component_degradation_max: 0.05
    reconstruction_close_relative: 0.02
    effective_code_improvement_min: 0.1
    health_branch_degradation_max: 0.05
    endpoint: matched_final_10000_step_validation; selected_checkpoint_reported_separately
    failure_action: retain_direct_hard_schedule_no_new_budget_or_G5_launch
resources:
  devices:
  - cuda:0
  - cuda:1
  workers_per_device_candidates:
  - 1
  benchmark_steps: 100
  benchmark_evaluation_examples: 256
  benchmark_tasks:
  - eeg_waveform
  - eeg_waveform
  torch_threads: 2
  numerical_threads: 1
  mmap_parent_cache: 256
  gpu_memory_limit_gib: 4
  supervisor_memory_gib: 96
  supervisor: user_systemd_linger
  parallelism: one_candidate_on_one_GPU; two independent_device_pilots_then_choose_faster_device
baseline_run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261117_base_g1_v2
baseline_contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_g1_v1.yaml
selection_run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261117_base_g124_v1
completion_review: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261117_base_g124_v1/completion_review_20261118_v1.json
external_warmups:
  eeg__waveform:
    run: experiments/runs/physiology_semantic_tokenizer/dual_component_tokenizer/20261117_base_g1_v2
    contract: experiments/configs/physiology_semantic_tokenizer/dual_component_base_g1_v1.yaml
    task_id: eeg__waveform__warmup
