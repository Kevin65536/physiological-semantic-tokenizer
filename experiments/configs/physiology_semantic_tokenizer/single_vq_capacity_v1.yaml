diagnostic: native band energy, RMS and seams, Hb extrema and slope, per-person scores, continuous-to-hard gap, code occupancy and final codebook geometry
selection: at fixed EEG K choose lowest final development macro NMSE, tie smaller d; for replication require lower NMSE than original K128 and positive mean designated ID gains on both branches, then lowest NMSE, smaller K and d
null: no joint gain in reconstruction and actual ID attributes relative to the original single-level baseline
stopping: final fixed step 10000; keep failures; second seed for at most one eligible configuration per modality; all selection exploratory, no freezing decision
