initialization: shared continuous warmup per modality, dimension and seed; train-only G0 records, repeated independently until adequate for largest K
uniform_count_fraction: 0.1
primary: X/S/O NMSE averaged over colors, positions within crop, crops within record, records within person and persons within dataset, then equal datasets
