primary: Three-class balanced accuracy averaged within development person then over people. Frozen code-vector and conventional continuous EEG/Hb/fusion. Train-person CV selects ridge; no evaluation fitting.
secondary: Response in each sensor region, mean measured HbO/HbR 9..19 s minus 1..9 s. Add EEG-S family directed transitions (1..9 s) to condition, early Hb, five EEG bands, family occupancy and run lengths. Shuffle EEG order within runs by reversing or preserving whole sequence at random per person/event/site, retaining occupancy and run lengths. Offline association.
diagnostic: EEG-only readout, decoded S, O and sum, clean versus fixed added 60-uV Gaussian pulse at +6 s (bilateral frontal weight 1, parietal 0.2, sigma 0.15 s); 2-Hz highpass comparator. Injection transfer RMS and posterior clean alpha-band power recovery.
null_hypothesis: No fusion gain, no sequence gain beyond continuous and occupancy controls, or attenuation with loss of measured rhythm/function.
gates: Primary priority if fusion exceeds each unimodal and continuous fusion by at least 0.02 BA and improves for at least 3/4 people in each comparison. For modality complementarity alone compare continuous fusion with both continuous unimodals by same rule. Sequence priority if mean normalized MSE improves over both baseline and randomized order by at least 0.02 with 3/4 positive people each. Denoising priority if S passes all three thresholds on average and for 3/4 people (pulse RMS transfer below 0.5, posterior alpha power ratio 0.8..1.25, perturbed BA within 0.02 of clean conventional EEG).
stopping: One pass on common support. Keep failed cases and person-level directions. No new full training, protected evaluation, or tuning to development.
