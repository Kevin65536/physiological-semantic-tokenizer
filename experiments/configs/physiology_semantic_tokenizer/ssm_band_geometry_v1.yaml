    states and clean Hb in shared condition; stress conditions reported separately
  geometry_scope: prespecified split-band representation; synthetic entry required
    for split and geometry; selection rule fixed before any outer evaluation
  nulls: same-subject same-session MA training donor; session training template; 15
    s circular EEG feature shift before baseline
  boundary: only retained 72 original training identities; no excluded positions 4/9,
    protected campaign, tokenizer or physiological adaptation
  secondary_stress: random 10/30 percent EEG feature times and first local EEG channel
    missing, synthetic shared panels only; whole-channel reduction uses visible covariance
    submatrix
  failed_baseline: retain invalid baseline; primary comparisons undefined when required
    denominators incomplete; no fallback
  point_prediction_only: true
