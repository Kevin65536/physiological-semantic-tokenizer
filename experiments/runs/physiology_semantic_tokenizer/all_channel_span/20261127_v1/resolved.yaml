inputs: Fixed public event identities and paired clocks from parent events.csv; all native scalp electrodes and all native HbO/HbR pairs. Per-branch parent tokenizer frozen. Reuse parent train-only site scales and task Hb gain; missing positive site scale falls back to median positive training site scale within dataset/modality. Full-record offline input coordinate.
objective: Each update sees all EEG and Hb sites simultaneously. Cycle EEG/Hb targets and time span, local site neighborhood, whole modality. Mask raw samples before tokenizer and Hb reference. Invalid slots and padding are never targets or source keys. Average masked-ID CE over valid targets per event per branch, then over branches and events.
initialization: Both seeds use their own terminal joint tokenizer and temporal/typed-lag reader from expanded_v2. New same-modality geometry layers trained with the reader. Codebooks and tokenizer weights frozen.
primary: Development masked bits per valid ID; average inside each event/branch then within person then across people; also separate target modality and mask family.
baseline: Same trained reader with opposite-modality messages switched off at evaluation, on exactly the same masks.
null: Cross-modal messages do not improve held-person masked-ID log score. No physiological coupling or classification inference.
stopping: Fixed updates per seed; one terminal evaluation on public validation. Preserve per-event denominators, all layouts and failures. No validation-driven model selection.
