schema: downstream_repair_probe_v1
experiment_id: DOWNSTREAM-REBENCH-v2-PROBE-r3
scope: retained_public_train_validation_development_only
parent_run: comparative_methods/runs/performance_analysis/20261105_downstream_input_audit_v1
artifact_root: comparative_methods/runs/performance_analysis/20261105_downstream_repair_probe_v3
tasks:
- visual
- refed_regression
source_partitions:
- train
- validation
evaluation: three_subject_folds_on_original_development_pool
fold_seed: 20261105
model_seed: 17
input: same30s_samples_real_Hb_pairs_native_vs_frozen_preprocessing_audit
metadata_only: retained_parent_canonical_ids_for_record_and_window_times
test: no_signal_target_or_prediction_access_outside_retained_parent_population
metrics: v2_subject_equal_ACC_F1_dynamic_CCC_and_all_target_native_errors
features:
  modality: real HbT=HbO+HbR; both components must have valid support
  refed: one_second_mean_max_min_SD_slope_Gaussian_DE_from_local_variance
  visual: six_5second_bins_with_mean_max_min_referenced_to_first5seconds; SD_slope_Gaussian_DE
  fold_transform: training-only feature mean/SD and fixed block norm; no per-window
    normalization
models:
  visual:
    cached_linear:
      features: native_cached
      estimator: logistic
      C: 10.0
    cached_rbf:
      features: native_cached
      estimator: svc
      C: 10.0
      gamma: 0.5
    bandpass_linear:
      features: native_bandpass
      estimator: logistic
      C: 10.0
    bandpass_rbf:
      features: native_bandpass
      estimator: svc
      C: 10.0
      gamma: 0.5
    lowpass_linear:
      features: native_lowpass
      estimator: logistic
      C: 10.0
    lowpass_rbf:
      features: native_lowpass
      estimator: svc
      C: 10.0
      gamma: 0.5
  refed_regression:
    cached_ridge:
      features: native_cached
      estimator: ridge
      alpha: 1.0
    cached_rbf:
      features: native_cached
      estimator: nystroem_ridge
      alpha: 0.01
      gamma: 0.1
      landmarks: 512
    bandpass_ridge:
      features: native_bandpass
      estimator: ridge
      alpha: 1.0
    bandpass_rbf:
      features: native_bandpass
      estimator: nystroem_ridge
      alpha: 0.01
      gamma: 0.1
      landmarks: 512
    lowpass_ridge:
      features: native_lowpass
      estimator: ridge
      alpha: 1.0
    lowpass_rbf:
      features: native_lowpass
      estimator: nystroem_ridge
      alpha: 0.01
      gamma: 0.1
      landmarks: 512
fit:
  logistic_max_iter: 10000
  logistic_tol: 1.0e-07
  classification_weight: equal_subject_then_inverse_training_class_prior
  regression_weight: equal_subject_record_coordinate_then_valid_time
  neural_epochs: 40
  neural_batch_size: 64
  neural_width: 128
  neural_dropout: 0.5
  neural_learning_rate: 0.001
  neural_weight_decay: 0.01
  neural_selection: fixed_final_epoch_no_held_fold_checkpoint_selection
  regression_output: declared_sigmoid_1_to255_for_temporal_conv_other_outputs_unclipped
  all_candidates: retained_no_best_fold_or_subject_selection
stopping: fixed_round_matrix_then_independent_aggregate_and_evidence_guided_next_version
resources:
  threads_per_job: 2
  cpu_thread_budget: 12
  ram_budget_gib: 72
  gpus:
  - 0
  - 1
  max_gpu_jobs_per_device: 1
  gpu_reserve_mib:
    0: 3072
    1: 3072
  supervisor: existing_user_systemd_rebenchmark_scheduler
feature_version: 2
record_controls:
  visual:
    features: native_lowpass
    split: within_subject_separate_Part_two_folds
    estimator: balanced_logistic_C1
    single_record_subjects: explicitly_unavailable_not_primary_denominator_change
  refed_regression:
    features: native_lowpass
    split: within_subject_three_folds_of_whole_videos
    estimator: ridge
    alpha: 1.0
native_hb_audit:
  scope: same_retained_development_subjects_and_windows_native_Hb_only
  input_cache: data/cache/physiology_downstream_v1
  views:
  - cached
  - bandpass
  - lowpass
  bandpass_hz:
  - 0.01
  - 0.7
  lowpass_hz: 0.7
  filter_order: 3
  replay_hz:
  - 0.01
  - 0.2
  replay_relative_rms_tolerance: 1.0e-06
  workers: 2
  support: same retained sample masks, exact channel identities, offline full-record
    filters as existing cache; no extra resting baseline
  native_reader: src.data.unified_physiology.load_native_fnirs_record
  boundary: validate retained development identities before native source reads; original
    test signals not read
