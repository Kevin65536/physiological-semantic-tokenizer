schema: downstream_repair_probe_v1
experiment_id: DOWNSTREAM-REBENCH-v2-PROBE-r13
scope: retained_public_train_validation_development_only
parent_run: comparative_methods/runs/performance_analysis/20261105_downstream_input_audit_v1
artifact_root: comparative_methods/runs/performance_analysis/20261105_downstream_repair_probe_v13
tasks:
- visual
source_partitions:
- train
- validation
evaluation: three_subject_folds_on_original_development_pool
fold_seed: 20261105
model_seed: 17
input: corrected_matched16_EEG_and_all_real_Hb_same30s_parent_arrays
metadata_only: retained_parent_canonical_ids_for_record_and_window_times
test: no_signal_target_or_prediction_access_outside_retained_parent_population
metrics: v2_subject_equal_ACC_F1_dynamic_CCC_and_all_target_native_errors
features:
  source: same_corrected16electrode_retained_30second_development_EEG
  unlabelled_window_scale: per_channel_mean_RMS_from_same30second_window;no_extra_person_context
  model_visible_event: 0to12seconds;raw200Hz_or_frozen_CB16electrode12time200component_tokens
  population_scale: per_input_component_mean_SD_from_current_training_people_only
  head: shared temporal/spatial filters;GroupNorm;separable temporal filters;six ordered
    average_max bins;four_class_plus_two_binary_auxiliary_outputs
  interpretation: compact_raw_signal_baseline_and_frozen_CBraMod_nonlinear_readout;not_new_pretraining_or_encoder_FT
models:
  visual:
    raw_event_conv:
      features: raw_event
      estimator: event_conv
      epochs: 40
      auxiliary_weight: 0.5
    cbramod_event_conv:
      features: encoder_sequence
      estimator: event_conv
      epochs: 40
      auxiliary_weight: 0.5
fit:
  logistic_max_iter: 10000
  logistic_tol: 1.0e-07
  classification_weight: equal_subject_then_inverse_training_class_prior
  regression_weight: equal_subject_record_coordinate_then_valid_time
  neural_epochs: 40
  neural_batch_size: 64
  neural_width: 128
  neural_dropout: 0.5
  neural_learning_rate: 0.001
  neural_weight_decay: 0.01
  neural_selection: fixed_final_epoch_no_held_fold_checkpoint_selection
  regression_output: declared_sigmoid_1_to255_for_temporal_conv_other_outputs_unclipped
  all_candidates: retained_no_best_fold_or_subject_selection
stopping: fixed_round_matrix_then_independent_aggregate_and_evidence_guided_next_version
resources:
  threads_per_job: 2
  cpu_thread_budget: 6
  ram_budget_gib: 72
  gpus:
  - 0
  - 1
  max_gpu_jobs_per_device: 1
  gpu_reserve_mib:
    0: 4096
    1: 4096
  supervisor: existing_user_systemd_rebenchmark_scheduler
feature_version: 2
hypothesis: The native decision can occur anywhere in0to12s; phase averages and high-dimensional
  dense heads may underuse temporally variable features. Test small shared spatial/temporal
  convolutions on raw EEG and frozen CBraMod per-second tokens with identical windows
  and supervision.
event_convolution: true
