models:
  visual:
    cbramod_event_linear:
      features: encoder_event
      estimator: logistic
      C: 1.0
      input_adaptation: unlabelled_subject
      interpretation: additional_unlabelled_person_context_not_strict_single_window_repair
    cbramod_event_mlp:
      features: encoder_event
      estimator: mlp
      auxiliary_weight: 0.5
      input_adaptation: unlabelled_subject
      interpretation: additional_unlabelled_person_context_not_strict_single_window_repair
  refed_regression:
    cached_subject_ridge:
      features: native_cached
      estimator: ridge
      alpha: 1.0
      feature_source_run: comparative_methods/runs/performance_analysis/20261105_downstream_repair_probe_v3
      input_adaptation: unlabelled_subject
      interpretation: additional_unlabelled_person_context_and_native_Hb_not_strict_single_window_repair
    lowpass_subject_ridge:
      features: native_lowpass
      estimator: ridge
      alpha: 1.0
      feature_source_run: comparative_methods/runs/performance_analysis/20261105_downstream_repair_probe_v3
      input_adaptation: unlabelled_subject
      interpretation: additional_unlabelled_person_context_and_native_Hb_not_strict_single_window_repair
    lowpass_subject_rbf:
      features: native_lowpass
      estimator: nystroem_ridge
      alpha: 0.01
      gamma: 0.1
      landmarks: 512
      feature_source_run: comparative_methods/runs/performance_analysis/20261105_downstream_repair_probe_v3
      input_adaptation: unlabelled_subject
      interpretation: additional_unlabelled_person_context_and_native_Hb_not_strict_single_window_repair
fit:
  logistic_max_iter: 10000
  logistic_tol: 1.0e-07
  classification_weight: equal_subject_then_inverse_training_class_prior
  regression_weight: equal_subject_record_coordinate_then_valid_time
  neural_epochs: 40
  neural_batch_size: 64
  neural_width: 128
  neural_dropout: 0.5
  neural_learning_rate: 0.001
  neural_weight_decay: 0.01
  neural_selection: fixed_final_epoch_no_held_fold_checkpoint_selection
  regression_output: declared_sigmoid_1_to255_for_temporal_conv_other_outputs_unclipped
  all_candidates: retained_no_best_fold_or_subject_selection
stopping: fixed_round_matrix_then_independent_aggregate_and_evidence_guided_next_version
resources:
  threads_per_job: 2
  cpu_thread_budget: 6
  ram_budget_gib: 72
  gpus:
  - 0
  - 1
  max_gpu_jobs_per_device: 1
  gpu_reserve_mib:
    0: 3072
    1: 3072
  supervisor: existing_user_systemd_rebenchmark_scheduler
feature_version: 2
retained_feature_run: comparative_methods/runs/performance_analysis/20261105_downstream_repair_probe_v1
